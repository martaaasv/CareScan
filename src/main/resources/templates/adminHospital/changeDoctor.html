<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{title.change.doctor}">Cambiar medico</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body>
    <div th:replace="fragments/header :: header"></div>

    <main class="pageWrapper">
        <div class="container card-surface">
            <h2 th:text="#{change.doctor.title}">Cambiar medico</h2>

            <p><b th:text="#{common.patient} + ':'">Paciente:</b> <span th:text="${patient.name}"></span></p>
            <p><b th:text="#{common.email} + ':'">Email:</b> <span th:text="${patient.email}"></span></p>

            <form th:action="@{/admin-hospital/patients/{id}/changeDoctor(id=${patient.id})}" method="post" class="formGrid">
                <label th:text="#{common.doctor} + ':'">Medico:</label>
                <select name="doctorId" required>
                    <option value="" disabled selected th:text="#{common.select.doctor}">Selecciona un medico</option>
                    <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.name + ' (' + d.email + ')'}">
                    </option>
                </select>

                <div class="cardActions">
                    <button type="submit" class="btnPrimary" th:text="#{common.save}">Guardar</button>
                    <a th:href="@{/admin-hospital/patients}" class="btnSecondary doctorClassicLinkButton" th:text="#{common.back}">Volver</a>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</body>


</html>
