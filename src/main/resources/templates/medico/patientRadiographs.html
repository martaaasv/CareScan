<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title th:text="#{title.patient.radiographs}">Radiografias del paciente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    
</head>

<body>

    <div th:replace="fragments/header :: header"></div>


    <main class="container">

        <div class="page-header">
            <h2><span th:text="#{patient.radiographs.of}">Radiografias de</span> <span th:text="${patient.name}">Paciente</span></h2>
        </div>

        <div th:if="${#lists.isEmpty(consultas)}" class="empty-state">
            <p th:text="#{patient.radiographs.empty}">No hay radiografias registradas para este paciente.</p>
        </div>

        <div th:if="${!#lists.isEmpty(consultas)}" class="table-wrapper">
            <table class="styled-table">
                <thead>
                    <tr>
                        <th th:text="#{common.date}">Fecha</th>
                        <th th:text="#{common.result}">Resultado</th>
                        <th th:text="#{common.probability}">Probabilidad</th>
                        <th th:text="#{common.actions}">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${consultas}">
                        <td th:text="${#temporals.format(c.fechaHora, 'dd/MM/yyyy HH:mm')}">25/02/2026 13:00</td>

                        <td>
                            <span th:if="${c.analisisIA != null}"
                                  th:text="${c.analisisIA.etiqueta == 'POSITIVO'} ? #{analysis.label.positive} : (${c.analisisIA.etiqueta == 'NEGATIVO'} ? #{analysis.label.negative} : ${c.analisisIA.etiqueta})"
                                  th:classappend="${c.analisisIA.etiqueta == 'POSITIVO'} ? 'badge badge-pos' : 'badge badge-neg'">
                                NEGATIVO
                            </span>
                            <span th:if="${c.analisisIA == null}" class="badge badge-neutral">—</span>
                        </td>

                        <td class="prob" th:text="${c.analisisIA != null ? c.analisisIA.probabilidad : '—'}">0.33</td>

                        <td>
                            <div class="actionButtons">
                                <button type="button" class="btn btn-primary"
                                    th:attr="data-img=@{'/medico/consultas/' + ${c.id} + '/image'}"
                                    onclick="openImageModal(this)">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M3 20.25h18M3.75 3h16.5A.75.75 0 0121 3.75v12a.75.75 0 01-.75.75H3.75A.75.75 0 013 15.75V3.75A.75.75 0 013.75 3z"/>
                                    </svg>
                                    <span th:text="#{medico.view.radiography}">Ver radiografia</span>
                                </button>

                                <a class="btn btn-outline"
                                    th:href="@{'/medico/patients/' + ${patient.id} + '/radiografias/' + ${c.id}}">
                                    <span th:text="#{medico.view.consultation.detail}">Ver detalle de la consulta</span>
                                </a>

                                <form th:if="${c.analisisIA != null and !c.analisisIA.visiblePaciente}"
                                    th:action="@{/medico/consultas/{id}/publish(id=${c.id})}" method="post" style="margin:0;">
                                    <input type="hidden" name="redirectTo"
                                        th:value="@{'/medico/patients/' + ${patient.id} + '/radiografias'}" />
                                    <button type="submit" class="btn btn-secondary"
                                        th:text="#{results.publish.patient}">Publicar resultado al paciente</button>
                                </form>

                                <span th:if="${c.analisisIA != null and c.analisisIA.visiblePaciente}"
                                    class="badge statusActive" th:text="#{results.published.short}">Publicado</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="footer-actions">
            <a th:href="@{/medico/patients}" class="btn btn-outline">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
                </svg>
                <span th:text="#{medico.back.patients}">Volver a pacientes</span>
            </a>
        </div>
    </main>

    <!-- MODAL IMAGEN -->
    <div id="imgModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 th:text="#{common.radiography}">Radiografia</h3>
                <button type="button" class="btn-close" onclick="closeImageModal()" th:aria-label="#{common.close}">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <img id="imgModalContent" src="" th:alt="#{common.radiography}" />
            </div>
        </div>
    </div>

    <script>
        function openImageModal(btn) {
            const url = btn.getAttribute("data-img");
            document.getElementById("imgModalContent").src = url;
            document.getElementById("imgModal").style.display = "flex";
        }

        function closeImageModal() {
            document.getElementById("imgModalContent").src = "";
            document.getElementById("imgModal").style.display = "none";
        }

        document.getElementById("imgModal").addEventListener("click", function (e) {
            if (e.target === this) closeImageModal();
        });

        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") closeImageModal();
        });
    </script>

        <div th:replace="fragments/footer :: footer"></div>
    
</body>
</html>
