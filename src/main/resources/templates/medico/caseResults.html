<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{title.results}">Resultados</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body>
    <div th:replace="fragments/header :: header"></div>
    <main>
        <div class="container">
            <h2 th:text="#{results.upload.title}">Resultado de la subida</h2>

            <p th:if="${error}" th:text="${error}"></p>

            <div th:unless="${error}">
                <p><b th:text="#{common.patient} + ':'">Paciente:</b> <span th:text="${patient.name}">—</span></p>
                <p><b th:text="#{common.email} + ':'">Email:</b> <span th:text="${patient.email}">—</span></p>

                <div th:if="${consulta.analisisIA != null}">
                    <p><b th:text="#{common.probability} + ':'">Probabilidad:</b> <span th:text="${@analysisView.formatProbability(consulta.analisisIA.probabilidad)}">—</span></p>
                    <p><b th:text="#{common.label} + ':'">Etiqueta:</b> <span
                            th:text="${@analysisView.displayLabel(consulta.analisisIA.etiqueta)}">—</span></p>
                    <p><b th:text="#{common.model} + ':'">Modelo:</b> <span th:text="${consulta.analisisIA.modeloVersion}">—</span></p>
                </div>

                <div th:if="${consulta.analisisIA != null and consulta.analisisIA.heatmapImagen != null}">
                    <p><b th:text="#{analysis.heatmap.title} + ':'">Mapa de calor:</b></p>
                    <img th:src="@{'/medico/consultas/' + ${consulta.id} + '/heatmap'}"
                        th:alt="#{analysis.heatmap.title}"
                        style="max-width:100%;height:auto;border-radius:8px;">
                </div>

                <div th:if="${consulta.analisisIA != null}">

                    <div th:if="${!consulta.analisisIA.visiblePaciente}">
                        <form th:action="@{/medico/consultas/{id}/publish(id=${consulta.id})}" method="post">
                            <div class="formRow">
                                <label for="comentarioMedicoCase" th:text="#{results.medical.comment}">Comentario medico</label>
                                <textarea id="comentarioMedicoCase" name="comentarioMedico" rows="4"
                                    th:placeholder="#{results.medical.comment.placeholder}"></textarea>
                            </div>
                            <input type="hidden" name="redirectTo"
                                th:value="@{'/medico/consultas/' + ${consulta.id} + '/results'}" />
                            <button type="submit" th:text="#{results.publish.patient}">Publicar resultado al paciente</button>
                        </form>
                    </div>

                    <div th:if="${consulta.analisisIA.visiblePaciente}">
                        <p style="color:green;"><b th:text="#{results.published.patient}">Resultado publicado al paciente</b></p>
                        <p th:if="${!#strings.isEmpty(consulta.analisisIA.comentarioMedico)}">
                            <b th:text="#{results.medical.comment} + ':'">Comentario medico:</b>
                            <span th:text="${consulta.analisisIA.comentarioMedico}">—</span>
                        </p>
                    </div>

                </div>


                <p th:if="${consulta.analisisIA == null}">
                    <span th:text="#{results.no.analysis}">Aun no hay analisis disponible.</span>
                </p>


            </div>


            <a th:href="@{/medico/patients}" class="btn" th:text="#{common.back}">Volver</a>
            <a th:href="@{'/medico/patients/' + ${patient.id} + '/radiografias/' + ${consulta.id}}" class="btn btn-outline">
                <span th:text="#{medico.view.consultation.detail}">Ver detalle de la consulta</span>
            </a>


        </div>
    </main>

        <div th:replace="fragments/footer :: footer"></div>

   
</body>

</html>
