<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{title.login}">CareScan - Inicio de sesion</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>

<body>
    <header>
        <div class="logo">CareScan</div>
        <nav>
            <ul>
                <li><a href="/saberMas" th:text="#{nav.about}">Saber mas</a></li>
            </ul>
            <div class="lang-switcher">
                <form method="get">
                    <label for="langSelect" class="lang-label" th:text="#{lang.selector}">Idioma</label>
                    <select id="langSelect" name="lang" class="lang-select" onchange="this.form.submit()">
                        <option value="es" th:selected="${#locale.language == 'es'}" th:text="#{lang.es}">Castellano
                        </option>
                        <option value="ca" th:selected="${#locale.language == 'ca'}" th:text="#{lang.ca}">Catalan
                        </option>
                        <option value="gl" th:selected="${#locale.language == 'gl'}" th:text="#{lang.gl}">Gallego
                        </option>
                        <option value="eu" th:selected="${#locale.language == 'eu'}" th:text="#{lang.eu}">Vasco</option>
                        <option value="en" th:selected="${#locale.language == 'en'}" th:text="#{lang.en}">Ingles
                        </option>
                    </select>
                </form>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="hero">

            <div id="modal-overlay" th:classappend="${param.error} ? 'show error' :
                             (${param.logout} ? 'show info' :
                             (${param.registered} ? 'show success' : ''))">
                <div class="modal-box">
                    <p th:text="${param.error} ? #{login.modal.error} :
                       (${param.logout} ? #{login.modal.logout} :
                       (${param.registered} ? #{login.modal.registered} : ''))">
                    </p>
                    <button type="button" id="closeModal" th:text="#{common.close}">Cerrar</button>
                </div>
            </div>

            <form action="/login" method="post" class="login-form">
                <h2 th:text="#{login.heading}">INICIO DE SESION</h2>

                <div class="form-group">
                    <label for="email" th:text="#{login.email}">Correo:</label>
                    <input type="text" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password" th:text="#{login.password}">Contrasena:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <input type="hidden" name="_csrf" value="{{token}}" />

                <button type="submit" class="btn btn-primary" th:text="#{home.login.button}">Iniciar sesion</button>

            </form>
        </section>
    </main>


    <script>
        window.addEventListener('load', () => {
            const modal = document.getElementById('modal-overlay');
            const closeBtn = document.getElementById('closeModal');
            if (!modal) return;

            if (modal.classList.contains('show')) {
                closeBtn.addEventListener('click', () => modal.classList.remove('show'));
                modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });
                setTimeout(() => modal.classList.remove('show'), 4000);
            }
        });
    </script>
    <div th:replace="fragments/footer :: footer"></div>
</body>

</html>
