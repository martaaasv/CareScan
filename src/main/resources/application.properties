# Nombre de la aplicación
spring.application.name=CareScan

# Logging para SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configuración del servidor
server.port=8443

# Configuración de subida de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Conexión a MySQL 
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/carescan_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

#Para Postman
server.ssl.enabled=true
server.ssl.key-store=classpath:carescan.p12
server.ssl.key-store-password=123456
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=carescan

# Brain tumor inference API
brain-tumor.api.base-url=${BRAIN_TUMOR_API_BASE_URL:http://127.0.0.1:8000}
brain-tumor.api.predict-path=${BRAIN_TUMOR_API_PREDICT_PATH:/predict}
brain-tumor.api.connect-timeout-ms=5000
brain-tumor.api.read-timeout-ms=30000
brain-tumor.model-version=${BRAIN_TUMOR_MODEL_VERSION:resnet50-brain-tumor-v1}
