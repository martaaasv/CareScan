<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{title.patient.results}">CareScan - Resultados del paciente</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body>

    <div th:replace="fragments/header :: header"></div>

    <main>
        <div class="container">
            <h2 class="page-title" th:text="#{patient.results.title}">Resultados publicados</h2>

            <div th:if="${#lists.isEmpty(consultas)}" class="empty-state">
                <p th:text="#{patient.results.empty}">No hay resultados publicados.</p>
            </div>

            <table th:if="${!#lists.isEmpty(consultas)}" class="styled-table">
                <thead>
                    <tr>
                        <th th:text="#{common.date}">Fecha</th>
                        <th th:text="#{common.probability}">Probabilidad</th>
                        <th th:text="#{common.label}">Etiqueta</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${consultas}">
                        <td th:text="${#temporals.format(c.fechaHora, 'dd/MM/yyyy HH:mm')}">25/02/2026 13:00</td>
                        <td th:text="${c.analisisIA.probabilidad}"> %</td>
                        <td th:text="${c.analisisIA.etiqueta}"></td>
                    </tr>
                </tbody>
            </table>

            <p><a th:href="@{/}" th:text="#{nav.home}">Inicio</a></p>
        </div>
    </main>
    <div th:replace="fragments/footer :: footer"></div>
</body>

</html>
