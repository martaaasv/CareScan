<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{title.patient.management}">Gestion de pacientes</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body>

    <div th:replace="fragments/header :: header"></div>

    <main>
        <div class="container">
            <h2 th:text="#{patient.management.title}">Gestion de pacientes</h2>

            <p th:if="${error}" style="color:red;" th:text="${error}"></p>
            <p th:if="${success}" style="color:green;" th:text="${success}"></p>

            <table class="tableFullWidth">
                <thead>
                    <tr>
                        <th th:text="#{common.patient}">Paciente</th>
                        <th th:text="#{common.email}">Email</th>
                        <th th:text="#{common.status}">Estado</th>
                        <th th:text="#{patient.management.assigned.doctor}">Medico asignado</th>
                        <th th:text="#{common.actions}">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${patients}">
                        <td th:text="${p.name}">Nombre</td>
                        <td th:text="${p.email}">Email</td>

                        <td>
                            <span
                                th:if="${p.estado == null or p.estado == T(es.marta.tfg.carescan.model.Estado).ESPERANDO_ASIGNACION}"
                                class="statusBadge statusWaiting" th:text="#{status.waiting.assignment}">ESPERANDO
                                ASIGNACION</span>

                            <span
                                th:if="${p.estado != null and p.estado == T(es.marta.tfg.carescan.model.Estado).ACTIVO}"
                                class="statusBadge statusActive" th:text="#{status.active}">ACTIVO</span>

                            <span
                                th:if="${p.estado != null and p.estado == T(es.marta.tfg.carescan.model.Estado).INACTIVO}"
                                class="statusBadge statusInactive" th:text="#{status.inactive}">INACTIVO</span>
                        </td>

                        <td
                            th:text="${patientDoctorMap[p.id] != null ? patientDoctorMap[p.id] : #messages.msg('patient.management.unassigned')}">
                            Sin asignar
                        </td>

                        <td>
                            <div class="actionButtons">

                                <!-- CAMBIAR MÉDICO: activo -> link real; inactivo -> botón gris sin link -->
                                <a th:if="${p.estado != null and p.estado != T(es.marta.tfg.carescan.model.Estado).INACTIVO}"
                                    th:href="@{/admin-hospital/patients/{id}/changeDoctor(id=${p.id})}">
                                    <button type="button" class="btnAction btnGreen">
                                        <span th:text="#{patient.management.change.doctor}">Cambiar medico</span>
                                    </button>
                                </a>

                                <button
                                    th:if="${p.estado != null and p.estado == T(es.marta.tfg.carescan.model.Estado).INACTIVO}"
                                    type="button" class="btnAction btnGreen btnDisabled" disabled>
                                    <span th:text="#{patient.management.change.doctor}">Cambiar medico</span>
                                </button>

                                <!-- DAR DE BAJA: activo -> form submit; inactivo -> botón gris sin submit -->
                                <form
                                    th:if="${p.estado != null and p.estado != T(es.marta.tfg.carescan.model.Estado).INACTIVO}"
                                    th:action="@{/admin-hospital/patients/{id}/deactivate(id=${p.id})}" method="post"
                                    style="margin:0;">
                                    <button type="submit" class="btnAction btnRed">
                                        <span th:text="#{patient.management.deactivate}">Dar de baja</span>
                                    </button>
                                </form>

                                <button
                                    th:if="${p.estado != null and p.estado == T(es.marta.tfg.carescan.model.Estado).INACTIVO}"
                                    type="button" class="btnAction btnRed btnDisabled" disabled>
                                    <span th:text="#{patient.management.deactivate}">Dar de baja</span>
                                </button>


                            </div>
                        </td>

                    </tr>
                </tbody>
            </table>

            <br>
            <a th:href="@{'/' + ${userId} + '/home'}"><button type="button" th:text="#{common.back}">Volver</button></a>

        </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</body>

</html>
