<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{title.new.assignment}">Asignar medico y paciente</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body>

    <div th:replace="fragments/header :: header"></div>

    <main class="pageWrapper">
        <section class="card card-surface">

            <div class="cardHeader">
                <div>
                    <h2 class="cardTitle" th:text="#{new.assignment.title}">Asignar medico paciente</h2>
                    <p class="cardSubtitle" th:text="#{new.assignment.subtitle}">Selecciona un medico y un paciente para
                        crear una asignacion activa.</p>
                </div>
            </div>

            <div th:if="${error}" class="alert alertError">
                <span th:text="${error}"></span>
            </div>

            <div th:if="${success}" class="alert alertSuccess">
                <span th:text="${success}"></span>
            </div>

            <form th:action="@{/admin-hospital/assignments}" method="post" class="formGrid">

                <div class="formRow">
                    <label for="doctorId" th:text="#{common.doctor}">Medico</label>
                    <select id="doctorId" name="doctorId" required>
                        <option value="" selected disabled th:text="#{common.select.doctor}">Selecciona un medico
                        </option>
                        <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.name + ' (' + d.email + ')'}">
                        </option>
                    </select>
                </div>

                <div class="formRow">
                    <label for="patientId" th:text="#{common.patient}">Paciente</label>
                    <select id="patientId" name="patientId" required>
                        <option value="" selected disabled th:text="#{common.select.patient}">Selecciona un paciente
                        </option>
                        <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.name + ' (' + p.email + ')'}">
                        </option>
                    </select>
                </div>

                <div class="cardActions">
                    <button type="submit" class="btnPrimary" th:text="#{new.assignment.submit}">Asignar</button>

                    <a th:href="@{'/' + ${userId} + '/home'}" class="btnSecondary doctorClassicLinkButton" th:text="#{common.back}">Volver</a>
                </div>

            </form>

        </section>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</body>

</html>
