<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{title.admin.users}">CareScan - Gestion de usuarios</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body>

    <div th:replace="fragments/header :: header"></div>

    <main2>
        <div class="container history-page">
            <h2 class="page-title" th:text="#{admin.users.title}">Gestion de usuarios</h2>

            <div th:if="${mensajeExito}" class="alert-success" th:text="${mensajeExito}"></div>
            <div th:if="${mensajeError}" class="alert-error" th:text="${mensajeError}"></div>

            <div th:if="${#lists.isEmpty(users)}" class="empty-state">
                <p th:text="#{admin.users.empty}">No hay usuarios registrados.</p>
            </div>

            <table th:if="${!#lists.isEmpty(users)}" class="styled-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th th:text="#{common.name}">Nombre</th>
                        <th th:text="#{common.email}">Email</th>
                        <th th:text="#{common.role}">Rol</th>
                        <th th:text="#{admin.dashboard.consultas.count}">N consultas</th>
                        <th th:text="#{common.actions}">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.id}">1</td>
                        <td th:text="${u.name}">Nombre</td>
                        <td th:text="${u.email}">email@example.com</td>
                        <td th:text="${u.role}">ROL</td>
                        <td th:text="${consultasCount[u.id]}">0</td>
                        <td>
                            <form th:action="@{'/admin/users/' + ${u.id} + '/role'}" method="post"
                                style="display:inline;">
                                <select name="role">
                                    <option th:value="ADMIN_IT" th:selected="${u.role.name() == 'ADMIN_IT'}"
                                        th:text="#{role.admin_it}">ADMIN IT</option>
                                    <option th:value="ADMIN_HOSPITAL"
                                        th:selected="${u.role.name() == 'ADMIN_HOSPITAL'}"
                                        th:text="#{role.admin_hospital}">ADMIN HOSPITAL</option>
                                    <option th:value="MEDICO" th:selected="${u.role.name() == 'MEDICO'}"
                                        th:text="#{role.medico}">MEDICO</option>
                                    <option th:value="PACIENTE" th:selected="${u.role.name() == 'PACIENTE'}"
                                        th:text="#{role.paciente}">PACIENTE</option>
                                </select>
                                <button type="submit" th:text="#{admin.users.role.update}">Actualizar rol</button>
                            </form>
                            <form th:action="@{'/admin/users/' + ${u.id} + '/hard-delete'}" method="post"
                                onsubmit="return confirm(this.dataset.confirm);"
                                th:attr="data-confirm=#{admin.users.delete.confirm}"
                                style="display:inline;">
                                <button type="submit" class="btn-delete" style="color:red;">
                                    <span th:text="#{common.delete}">Eliminar</span>
                                </button>
                            </form>

                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main2>
    <div th:replace="fragments/footer :: footer"></div>
</body>

</html>
