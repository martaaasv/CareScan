<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir imagen</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body>
    <header>
        <div class="logo">CareScan</div>

        <nav class="main-nav">
            <div class="nav-right">

                <div sec:authorize="isAnonymous()">
                    <a th:href="@{/about}">Saber más</a>
                </div>

                <div class="user-menu" sec:authorize="isAuthenticated()">
                    <button type="button" class="user-menu-toggle">
                        <span class="user-avatar" th:text="${#strings.substring(username,0,1)}">U</span>
                        <span class="user-name" th:text="${username}">Usuario</span>
                    </button>

                    <div class="user-menu-dropdown">
                        <a th:href="@{'/' + ${userId} + '/home'}">Home</a>
                        <a th:href="@{'/' + ${userId} + '/settings'}">Configuración</a>
                        <a th:href="@{'/upload/' + ${userId} + '/history'}">Mis consultas</a>
                        <a href="#" onclick="openLogoutModal()">Cerrar sesión</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <h2>Subir una imagen</h2>

            <p><b>Paciente:</b> <span th:text="${patient.name}">—</span></p>
            <p><b>Email:</b> <span th:text="${patient.email}">—</span></p>

            <p>Selecciona una imagen desde tu dispositivo para realizar la demostración.</p>

            <form th:action="@{/medico/patients/{patientId}/upload(patientId=${patient.id})}" method="post"
                enctype="multipart/form-data">

                <input type="file" name="file" accept="image/*" required>
                <br>
                <button type="submit">Subir</button>
            </form>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 CareScan - TFG Marta</p>
    </footer>

    <!-- MODAL DE CONFIRMAR LOGOUT -->
    <div id="logoutModal" class="modal-overlay">
        <div class="modal">
            <p>
                ¿Seguro que deseas cerrar sesión?<br>
                Tendrás que volver a iniciar sesión para continuar.
            </p>
            <div class="modal-buttons">
                <button type="button" class="btn-confirm" onclick="confirmLogout()">Cerrar sesión</button>
                <button type="button" class="btn-cancel" onclick="closeLogoutModal()">Cancelar</button>
            </div>
        </div>
    </div>
    <script>
        function openLogoutModal() {
            document.getElementById("logoutModal").classList.add("active");
        }

        function closeLogoutModal() {
            document.getElementById("logoutModal").classList.remove("active");
        }

        function confirmLogout() {
            window.location.href = "/logout";
        }

        // Cerrar modal haciendo clic fuera
        document.getElementById("logoutModal").addEventListener("click", function (e) {
            if (e.target === this) closeLogoutModal();
        });
    </script>
</body>

</html>
