<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{title.admin.dashboard}">CareScan - Panel administrador</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body>

    <div th:replace="fragments/header :: header"></div>
    <main2>
        <div class="container history-page">

            <div class="stats-cards">
                <div class="stat-card">
                    <h3 th:text="#{admin.dashboard.total.users}">Total de usuarios</h3>
                    <p th:text="${totalUsuarios}">0</p>
                </div>
                <div class="stat-card">
                    <h3 th:text="#{admin.dashboard.total.consultas}">Total de consultas</h3>
                    <p th:text="${totalConsultas}">0</p>
                </div>
            </div>

            <h3 style="margin-top: 2rem;" th:text="#{admin.dashboard.consultas.by.user}">Consultas por usuario</h3>

            <table class="styled-table" th:if="${!#lists.isEmpty(users)}">
                <thead>
                    <tr>
                        <th th:text="#{common.user}">Usuario</th>
                        <th th:text="#{common.email}">Email</th>
                        <th th:text="#{admin.dashboard.consultas.count}">N de consultas</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.name}">Nombre</td>
                        <td th:text="${u.email}">email@example.com</td>
                        <td th:text="${consultasCount[u.id]}">0</td>
                    </tr>
                </tbody>
            </table>

            <div th:if="${#lists.isEmpty(users)}" class="empty-state">
                <p th:text="#{admin.dashboard.empty}">No hay datos de consultas todavia.</p>
            </div>

        </div>
    </main2>
    <div th:replace="fragments/footer :: footer"></div>
</body>

</html>
