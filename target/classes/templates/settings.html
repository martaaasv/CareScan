<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{title.settings}">CareScan - Configuracion de cuenta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body>
    <div th:replace="fragments/header :: header"></div>

    <main class="settings-main">
        <div class="settings-container">
            <aside class="settings-sidebar">
                <div class="settings-sidebar-header">
                    <div class="settings-avatar-circle" th:text="${#strings.substring(username,0,1)}">M</div>
                    <div class="settings-user-info">
                        <span class="settings-user-name" th:text="${username}">Usuario</span>
                        <span class="settings-user-email" th:text="${#authentication.name}">
                            email@ejemplo.com
                        </span>
                    </div>
                </div>

            </aside>

            <section class="settings-content">
                <h1 class="settings-title" th:text="#{settings.title}">Configuracion de cuenta</h1>
                <p class="settings-subtitle">
                    <span th:text="#{settings.subtitle}">Gestiona la seguridad de tu cuenta y la contrasena.</span>
                </p>


                <div class="settings-tab active" data-tab="security">
                    <div th:if="${passwordError}" class="alert alert-error" th:text="${passwordError}"></div>

                    <div th:if="${passwordSuccess}" class="alert alert-success" th:text="${passwordSuccess}"></div>

                    <div class="settings-card">
                        <h2 class="settings-card-title" th:text="#{settings.security.title}">Seguridad</h2>
                        <p class="settings-card-description">
                            <span th:text="#{settings.security.desc}">Cambia la contrasena que utilizas para iniciar sesion en CareScan.</span>
                        </p>

                        <form th:action="@{'/' + ${userId} + '/change-password'}" method="post">
                            <div class="form-control">
                                <label for="currentPassword" th:text="#{settings.password.current}">Contrasena actual</label>
                                <input type="password" id="currentPassword" name="currentPassword" required />
                            </div>

                            <div class="form-row">
                                <div class="form-control">
                                    <label for="newPassword" th:text="#{settings.password.new}">Nueva contrasena</label>
                                    <input type="password" id="newPassword" name="newPassword" required />
                                </div>

                                <div class="form-control">
                                    <label for="confirmPassword" th:text="#{settings.password.confirm}">Confirmar contrasena</label>
                                    <input type="password" id="confirmPassword" name="confirmPassword" required />
                                </div>
                            </div>

                            <div class="settings-card-actions">
                                <button type="submit" class="btn btn-primary">
                                    <span th:text="#{settings.save}">Guardar cambios</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>


            </section>
        </div>
    </main>

    <footer>
        <p th:text="#{footer.copyright}">&copy; 2026 CareScan - TFG Marta</p>
    </footer>

    <!-- Script para cambiar de pestaña sin recargar -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const links = document.querySelectorAll('.settings-nav-link[data-tab-target]');
            const tabs = document.querySelectorAll('.settings-tab');

            function activateTab(target) {
                tabs.forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.tab === target);
                });
                links.forEach(link => {
                    if (link.dataset.tabTarget === target) {
                        link.classList.add('active');
                    } else if (!link.classList.contains('danger-link')) {
                        link.classList.remove('active');
                    }
                });
            }

            links.forEach(link => {
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = this.dataset.tabTarget;
                    if (!target) return;
                    activateTab(target);
                });
            });

            if (window.location.hash === '#delete-section') {
                activateTab('delete');
            }
        });
    </script>
</body>

</html>
