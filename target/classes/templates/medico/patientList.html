<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{title.medico.patients}">Mis pacientes</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

    <div th:replace="fragments/header :: header"></div>
    <main class="container">

        <div class="page-header">
            <div>
                <h2 th:text="#{medico.patients.title}">Mis pacientes</h2>
                <p style="margin:0;font-size:.875rem;color:var(--gray-500);" th:if="${username}">
                    <span th:text="#{medico.session.active}">Sesion activa como</span> <strong
                        th:text="${username}"></strong>
                </p>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(patients)}" class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="1.5" style="color:var(--gray-300);margin-bottom:12px;">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 3.198l.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0112 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 016 18.719m12 0a5.971 5.971 0 00-.941-3.197m0 0A5.995 5.995 0 0012 12.75a5.995 5.995 0 00-5.058 2.772m0 0a3 3 0 00-4.681 2.72 8.986 8.986 0 003.74.477m.94-3.197a5.971 5.971 0 00-.94 3.197M15 6.75a3 3 0 11-6 0 3 3 0 016 0zm6 3a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0zm-13.5 0a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0z" />
            </svg>
            <p style="margin:0;" th:text="#{medico.patients.empty}">No tienes pacientes asignados.</p>
        </div>

        <div th:if="${!#lists.isEmpty(patients)}" class="table-wrapper">
            <table class="styled-table">
                <thead>
                    <tr>
                        <th th:text="#{common.patient}">Paciente</th>
                        <th th:text="#{common.email}">Email</th>
                        <th th:text="#{common.status}">Estado</th>
                        <th th:text="#{medico.radiographies}">Radiografias</th>
                        <th th:text="#{common.actions}">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${patients}">

                        <!-- Nombre -->
                        <td style="font-weight:500;color:var(--gray-900);" th:text="${p.name}">Nombre</td>

                        <!-- Email -->
                        <td style="color:var(--gray-500);font-size:.875rem;" th:text="${p.email}">email@ejemplo.com</td>

                        <!-- Estado -->
                        <td>
                            <span th:if="${p.active}" class="badge statusActive"
                                th:text="#{status.active}">Activo</span>
                            <span th:if="${!p.active}" class="badge statusInactive"
                                th:text="#{status.inactive}">Inactivo</span>
                        </td>

                        <!-- Ver radiografías -->
                        <td>
                            <a class="btn btn-outline btn-sm"
                                th:href="@{'/medico/patients/' + ${p.id} + '/radiografias'}">
                                <span th:text="#{medico.view.radiographies}" style="font-weight:500;color:var(--gray-900);">Ver radiografias</span>
                            </a>
                        </td>

                        <!-- Subir radiografía -->
                        <td>
                            <a th:if="${p.active}" class="btn btn-primary btn-sm"
                                th:href="@{/medico/patients/{id}/upload(id=${p.id})}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none"
                                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
                                </svg>
                                <span th:text="#{medico.upload.radiography}">Subir radiografia</span>
                            </a>

                            <span th:if="${!p.active}"
                                style="font-size:.8rem;color:var(--gray-400,#9ca3af);font-style:italic;">
                                <span th:text="#{common.not.available}">No disponible</span>
                            </span>
                        </td>

                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <div th:replace="fragments/footer :: footer"></div>
</body>

</html>
