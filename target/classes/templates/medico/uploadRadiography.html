<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{title.upload.image}">Subir imagen</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body>
    <div th:replace="fragments/header :: header"></div>

    <main>
        <div class="container">
            <h2 th:text="#{upload.image.title}">Subir una imagen</h2>

            <p><b th:text="#{common.patient} + ':'">Paciente:</b> <span th:text="${patient.name}">—</span></p>
            <p><b th:text="#{common.email} + ':'">Email:</b> <span th:text="${patient.email}">—</span></p>

            <p th:text="#{upload.image.subtitle}">Selecciona una imagen desde tu dispositivo para realizar la
                demostracion.</p>

            <form th:action="@{/medico/patients/{patientId}/upload(patientId=${patient.id})}" method="post"
                enctype="multipart/form-data">

                <input type="file" name="file" accept="image/*" required>
                <br>
                <button type="submit" th:text="#{upload.image.submit}">Subir</button>
            </form>

        </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</body>

</html>
