<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body>
    <header>
        <h1 class="logo">CareScan</h1>
        <nav>
            <ul>
                <li><a th:href="@{/}">Inicio</a></li>
                <li sec:authorize="isAnonymous()"><a th:href="@{/upload}">Ver demostración</a></li>
                <li sec:authorize="isAnonymous()"><a th:href="@{/about}">Saber más</a></li>
                <li sec:authorize="isAuthenticated()"><a th:href="@{/logout}">Cerrar sesión</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <h2>Resultado de la subida</h2>

            <p th:if="${error}" th:text="${error}"></p>

            <div th:unless="${error}">
                <p>Imagen subida: <strong th:text="${fileName}"></strong></p>
                <p>Número aleatorio generado: <strong th:text="${randomNumber}"></strong></p>
            </div>

            <a th:href="@{/upload}" class="btn">Volver</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 CareScan - TFG Marta</p>
    </footer>
</body>

</html>
