<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
    <header>
        <div class="logo">CareScan</div>

        <nav class="main-nav">

            <div class="nav-right">

                <div sec:authorize="isAnonymous()">
                    <a th:href="@{/upload}">Ver demostración</a>
                    <a th:href="@{/about}">Saber más</a>
                </div>

    
                <div class="user-menu" sec:authorize="isAuthenticated()">
                    <button type="button" class="user-menu-toggle">
                        <span class="user-avatar" th:text="${#strings.substring(username,0,1)}">U</span>
                        <span class="user-name" th:text="${username}">Usuario</span>
                        <span class="user-caret">▼</span>
                    </button>

                    <div class="user-menu-dropdown">
                        <a th:href="@{'/' + ${userId} + '/home'}">Home</a>
                        <a th:href="@{'/' + ${userId} + '/settings'}">Configuración</a>
                        <a th:href="@{'/upload/' + ${userId} + '/history'}">Mis consultas</a>
                        <a th:href="@{/logout}">Cerrar sesión</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <h2>Resultado de la subida</h2>

            <p th:if="${error}" th:text="${error}"></p>

            <div th:unless="${error}">
                <p>Imagen subida: <span th:text="${fileName}">—</span></p>
                <p>Número aleatorio generado: <span th:text="${randomNumber}">—</span></p>

            </div>

            <a th:href="@{'/' + ${userId} + '/home'}" class="btn">Volver</a>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 CareScan - TFG Marta</p>
    </footer>
</body>

</html>
