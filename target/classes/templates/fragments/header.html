<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

    <th:block th:fragment="header">
        <header>
            <div class="logo">Care<span style="color:var(--green-500)">Scan</span></div>

            <nav class="main-nav">
                <div class="nav-right">
                    <div class="lang-switcher">
                        <form method="get">
                            <label for="langSelect" class="lang-label" th:text="#{lang.selector}">Idioma</label>
                            <select id="langSelect" name="lang" class="lang-select" onchange="this.form.submit()">
                                <option value="es" th:selected="${#locale.language == 'es'}" th:text="#{lang.es}">Castellano
                                </option>
                                <option value="ca" th:selected="${#locale.language == 'ca'}" th:text="#{lang.ca}">Catalan
                                </option>
                                <option value="gl" th:selected="${#locale.language == 'gl'}" th:text="#{lang.gl}">Gallego
                                </option>
                                <option value="eu" th:selected="${#locale.language == 'eu'}" th:text="#{lang.eu}">Vasco
                                </option>
                                <option value="en" th:selected="${#locale.language == 'en'}" th:text="#{lang.en}">Ingles
                                </option>
                            </select>
                        </form>
                    </div>

                    <div class="user-menu" sec:authorize="isAuthenticated()">
                        <button type="button" class="user-menu-toggle">
                            <span class="user-avatar" th:text="${#strings.substring(username,0,1)}">U</span>
                            <span class="user-name" th:text="${username}">Usuario</span>
                        </button>

                        <div class="user-menu-dropdown">
                            <a th:href="@{'/' + ${userId} + '/home'}" th:text="#{nav.home}">Inicio</a>

                            <div sec:authorize="hasRole('ADMIN_IT')">
                                <a th:href="@{/admin/dashboard}" th:text="#{nav.admin.it}">Panel de administracion IT</a>
                                <a th:href="@{/admin/users}" th:text="#{nav.users}">Gestion de usuarios</a>
                                <a th:href="@{/admin/logs}" th:text="#{nav.audit.logs}">Logs de auditoria</a>
                            </div>

                            <div sec:authorize="hasRole('ADMIN_HOSPITAL')">
                                <a th:href="@{/admin-hospital/patients}" th:text="#{nav.patients.manage}">Gestionar
                                    pacientes</a>
                                <a th:href="@{/admin-hospital/patients/new}" th:text="#{nav.user.create}">Crear
                                    usuario</a>
                                <a th:href="@{/admin-hospital/assignments/new}" th:text="#{nav.assignments.create}">Asignar
                                    medico/paciente</a>
                            </div>

                            <div sec:authorize="hasRole('MEDICO')">
                                <a th:href="@{/medico/patients}" th:text="#{nav.my.patients}">Mis pacientes</a>
                            </div>

                            <div sec:authorize="hasRole('PACIENTE')">
                                <a th:href="@{/paciente/results}" th:text="#{nav.my.results}">Mis resultados</a>
                            </div>

                            <a href="#" onclick="openLogoutModal(); return false;" th:text="#{nav.logout}">Cerrar sesion</a>
                        </div>
                    </div>
                </div>
            </nav>
        </header>

        <div id="logoutModal" class="modal-overlay">
            <div class="modal modal-confirm">
                <div class="modal-header">
                    <div class="modal-confirm-heading">
                        <span class="modal-confirm-kicker" th:text="#{nav.logout}">Cerrar sesion</span>
                        <h3 th:text="#{logout.modal.question.line1}">Seguro que deseas cerrar sesion?</h3>
                    </div>
                    <button type="button" class="btn-close" onclick="closeLogoutModal()" th:aria-label="#{common.close}">
                        ×
                    </button>
                </div>
                <div class="modal-body">
                    <p class="modal-confirm-text" th:text="#{logout.modal.question.line2}">
                        Tendras que volver a iniciar sesion para continuar.
                    </p>
                </div>
                <div class="modal-buttons modal-buttons-end">
                    <form th:action="@{/logout}" method="post" onclick="event.stopPropagation()">
                        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn-confirm" th:text="#{nav.logout}">Cerrar sesion</button>
                    </form>
                    <button type="button" class="btn-cancel" onclick="closeLogoutModal()" th:text="#{common.cancel}">
                        Cancelar
                    </button>
                </div>
            </div>
        </div>

        <script>
            function openLogoutModal() {
                document.getElementById("logoutModal").classList.add("active");
            }

            function closeLogoutModal() {
                document.getElementById("logoutModal").classList.remove("active");
            }

            document.getElementById("logoutModal").addEventListener("click", function (e) {
                if (e.target === this) closeLogoutModal();
            });
        </script>
    </th:block>

</body>

</html>
