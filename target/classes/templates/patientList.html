<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Mis pacientes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <h2>Mis pacientes</h2>

    <div th:if="${username}">
        <p>Sesión: <b th:text="${username}"></b></p>
    </div>

    <div th:if="${#lists.isEmpty(patients)}">
        <p>No tienes pacientes asignados.</p>
    </div>

    <div th:if="${!#lists.isEmpty(patients)}">
        <table border="1" cellpadding="6">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${patients}">
                    <td th:text="${p.name}"></td>
                    <td th:text="${p.email}"></td>

                    <td>
                        <a th:href="@{/medico/patients/{id}/upload(id=${p.id})}">
                            Subir radiografía
                        </a>
                    </td>

                </tr>
            </tbody>
        </table>
    </div>

    <p>
        <a th:href="@{/admin-hospital/assignments/new}">Asignaciones (Admin Hospital)</a> |
        <a th:href="@{/}">Inicio</a>
    </p>

</body>

</html>
