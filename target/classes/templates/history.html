<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{title.history}">Mis consultas</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body>

    <div th:replace="fragments/header :: header"></div>
    <main2>
        <div class="container history-page">
            <h2 class="page-title" th:text="#{history.title}">Mis consultas</h2>

            <div th:if="${mensajeExito}" class="alert-success" th:text="${mensajeExito}"></div>
            <div th:if="${mensajeError}" class="alert-error" th:text="${mensajeError}"></div>

            <div th:if="${#lists.isEmpty(consultas)}" class="empty-state">
                <p th:text="#{history.empty}">No hay consultas todavia.</p>
            </div>

            <table th:if="${!#lists.isEmpty(consultas)}" class="styled-table">
                <thead>
                    <tr>
                        <th th:text="#{history.date.time}">Fecha y hora</th>
                        <th th:text="#{common.file}">Archivo</th>
                        <th th:text="#{common.result}">Resultado</th>
                        <th th:text="#{common.image}">Imagen</th>
                        <th th:text="#{common.actions}">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${consultas}">
                        <td th:text="${#temporals.format(c.fechaHora, 'dd/MM/yyyy HH:mm')}">--</td>
                        <td th:text="${c.nombreArchivo}">--</td>
                        <td th:text="${c.analisisIA != null ? @analysisView.displayLabel(c.analisisIA.etiqueta) : c.resultado}">--</td>
                        <td>
                            <a th:href="@{'/upload/consulta/' + ${c.id} + '/imagen'}" target="_blank" rel="noopener">
                                <img th:src="@{'/upload/consulta/' + ${c.id} + '/imagen'}" th:alt="#{history.image.alt}"
                                    style="max-width: 120px; max-height: 120px; border-radius: 4px;">
                            </a>
                        </td>
                        <td>
                            <button type="button" class="btn-delete-consulta" th:data-id="${c.id}">
                                <span th:text="#{history.delete}">Borrar consulta</span>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="actions-bottom">
                <a th:href="@{'/upload/' + ${userId}}">
                    <button th:text="#{history.upload.new}">Subir nueva imagen</button>
                </a>
            </div>

            <form id="deleteForm" th:action="@{'/upload/' + ${userId} + '/history/delete'}" method="post">
                <input type="hidden" name="consultaId" id="consultaIdField">
                <!--<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />-->
            </form>

            <div id="confirmModal" class="modal-overlay">
                <div class="modal">
                    <p>
                        <span th:text="#{history.modal.delete.line1}">Esta seguro de querer borrar la
                            consulta?</span><br>
                        <span th:text="#{history.modal.delete.line2}">Esta accion es permanente y no se puede
                            deshacer.</span>
                    </p>
                    <div class="modal-buttons">
                        <button type="button" id="btnAceptar" class="btn-confirm"
                            th:text="#{common.accept}">Aceptar</button>
                        <button type="button" id="btnCancelar" class="btn-cancel"
                            th:text="#{common.cancel}">Cancelar</button>
                    </div>
                </div>
            </div>

        </div>
    </main2>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const deleteButtons = document.querySelectorAll(".btn-delete-consulta");
            const modal = document.getElementById("confirmModal");
            const btnAceptar = document.getElementById("btnAceptar");
            const btnCancelar = document.getElementById("btnCancelar");
            const deleteForm = document.getElementById("deleteForm");
            const consultaIdField = document.getElementById("consultaIdField");

            let consultaIdSeleccionada = null;

            deleteButtons.forEach(btn => {
                btn.addEventListener("click", () => {
                    consultaIdSeleccionada = btn.getAttribute("data-id");
                    modal.classList.add("active");
                });
            });

            btnCancelar.addEventListener("click", () => {
                modal.classList.remove("active");
                consultaIdSeleccionada = null;
            });

            btnAceptar.addEventListener("click", () => {
                if (consultaIdSeleccionada) {
                    consultaIdField.value = consultaIdSeleccionada;
                    deleteForm.submit();
                }
            });

            modal.addEventListener("click", (e) => {
                if (e.target === modal) {
                    modal.classList.remove("active");
                    consultaIdSeleccionada = null;
                }
            });
        });
    </script>
    <div th:replace="fragments/footer :: footer"></div>

</body>

</html>
